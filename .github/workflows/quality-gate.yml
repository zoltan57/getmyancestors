name: Quality Gate

# Minimal gate for what this repository can currently verify: the locked
# dependency set installs, every module byte-compiles, the entry-point
# modules import cleanly, and the pytest suite passes. The project has no
# lint or type-check tooling configured yet (no ruff/mypy config) — add
# those steps here as that tooling lands, rather than assuming it.

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install from the lockfile
        # --locked fails if uv.lock has drifted from pyproject.toml, so a stale
        # lockfile is caught here rather than producing an untested dependency
        # set. Installs the package editable, which also verifies the packaging
        # metadata and that the getmyancestors console-script entry point resolves.
        run: uv sync --locked

      - name: Byte-compile all modules
        # Catches syntax errors in any module, including ones no entry point
        # imports. -q keeps output to errors only.
        run: uv run python -m compileall -q getmyancestors

      - name: Verify entry-point imports
        # Importing the CLI and fetch modules catches missing dependencies and
        # import-time errors that compileall cannot.
        run: |
          uv run python -c "import getmyancestors.cli"
          uv run python -c "import getmyancestors.fetch"

      - name: Run tests
        run: uv run pytest -q

name: Quality Gate

# Minimal gate for what this repository can currently verify: the locked
# dependency set installs, every module byte-compiles, the entry-point
# modules import cleanly, Ruff lint/format checks pass, and the pytest
# suite passes. Type-checking (e.g. ty) is not yet configured — add that
# step here as it lands, rather than assuming it.

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned to the version used to generate uv.lock (lockfile schema
          # `revision = 3`). Without a pin this defaults to whatever uv
          # release is newest at run time; uv's lockfile schema has changed
          # across versions (older uv can't parse a newer-schema lockfile
          # and vice versa), so version drift here makes `uv sync --locked`
          # fail immediately in CI regardless of pyproject.toml/uv.lock
          # actually being in sync. `[tool.uv] required-version` in
          # pyproject.toml enforces the same version for local `uv` runs.
          # Bump deliberately together with `uv lock --upgrade`.
          version: "0.12.9"
          python-version: "3.12"

      - name: Install from the lockfile
        # --locked fails if uv.lock has drifted from pyproject.toml, so a stale
        # lockfile is caught here rather than producing an untested dependency
        # set. Installs the package editable, which also verifies the packaging
        # metadata and that the getmyancestors console-script entry point resolves.
        run: uv sync --locked

      - name: Byte-compile all modules
        # Catches syntax errors in any module, including ones no entry point
        # imports. -q keeps output to errors only.
        run: uv run python -m compileall -q getmyancestors

      - name: Verify entry-point imports
        # Importing the CLI and fetch modules catches missing dependencies and
        # import-time errors that compileall cannot.
        run: |
          uv run python -c "import getmyancestors.cli"
          uv run python -c "import getmyancestors.fetch"

      - name: Lint and format check (Ruff)
        # Rule selection lives in pyproject.toml's [tool.ruff.lint] (explicit,
        # not ruff's own defaults -- see docs/decisions/2026-09-04-technical-stack.md).
        # --check fails without modifying files, matching a CI gate's read-only intent.
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

name: Quality Gate

# Minimal gate for what this repository can currently verify: the locked
# dependency set installs and every module byte-compiles. The project has no
# lint, type-check, or test tooling configured yet (no ruff/mypy config, no
# tests/ directory) — add those steps here as that tooling lands, rather than
# assuming it.

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install from the lockfile
        # --locked fails if uv.lock has drifted from pyproject.toml, so a stale
        # lockfile is caught here rather than producing an untested dependency
        # set. Installs the package editable, which also verifies the packaging
        # metadata and that the three console-script entry points resolve.
        run: uv sync --locked

      - name: Byte-compile all modules
        # Catches syntax errors in modules that no entry point imports
        # (e.g. GUI-only code paths). -q keeps output to errors only.
        run: uv run python -m compileall -q getmyancestors

      - name: Verify entry-point imports
        # Importing the CLI modules catches missing dependencies and
        # import-time errors that compileall cannot. The Tkinter GUI module
        # is excluded: importing it requires a display-capable Tk install.
        run: |
          uv run python -c "import getmyancestors.session"
          uv run python -c "import getmyancestors"

      - name: Run tests
        run: uv run pytest -q

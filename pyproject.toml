[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "getmyancestors"
description = "Capture raw FamilySearch Tree API responses into SQLite and load them into relational tables"
requires-python = ">=3.12"
license = {text = "GNU"}
keywords = [
  "getmyancestors",
  "familysearch",
  "genealogy",
  "sqlite",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
# Lower bounds only; exact versions are pinned by uv.lock. Upgrade deliberately
# with `uv lock --upgrade` (fake-useragent exists to avoid FamilySearch
# blocking — retest downloads after upgrading it).
dependencies = [
    "requests>=2.32.3",
    "fake-useragent>=2.0.3",
    # Deliberate exact pin: the LimiterAdapter mounted in getmyancestors/session.py
    # enforces the FamilySearch request rate. Held at the version validated
    # against FamilySearch; do not widen without retesting a real download
    # (0.8+ moves to pyrate-limiter 3.x with API/behavior changes).
    "requests-ratelimiter==0.7.0",
    "python-dotenv>=1.2.3",
]
dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
version = {attr = "getmyancestors.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
# Without this, setuptools' automatic flat-layout discovery finds `data/`
# (tracked only via data/.gitkeep, per README) as a second top-level package
# alongside `getmyancestors/` and refuses to build at all
# ("Multiple top-level packages discovered in a flat-layout"). Restrict
# discovery to the actual package explicitly instead of guessing.
include = ["getmyancestors*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv]
# Pinned to match .github/workflows/quality-gate.yml and the schema uv.lock
# was generated with. uv's lockfile schema changes across versions (an
# older uv can't parse a newer-schema lockfile and vice versa), so an
# unpinned/mismatched uv makes `uv sync --locked` fail even when
# pyproject.toml and uv.lock are actually in sync. Bump deliberately
# together with the CI pin and `uv lock --upgrade`.
required-version = "==0.12.9"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Explicit selection rather than relying on ruff's own defaults, which have
# changed across versions (see docs/decisions/2026-09-04-technical-stack.md).
# E/W/F: pycodestyle + pyflakes baseline. I: import sorting. UP: modern
# 3.12 syntax. B: flake8-bugbear common bug patterns. C4: comprehension
# simplifications. BLE: flags blind `except Exception`; the few
# intentional ones (worker/top-level error boundaries) are annotated with
# `# noqa: BLE001` at the call site rather than disabled project-wide.
# RUF: ruff-specific checks.
select = ["E", "W", "F", "I", "UP", "B", "C4", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Fixture literals pair a URL with its exact raw JSON body; wrapping them
# would hurt readability more than the line length helps.
"tests/test_fetch.py" = ["E501"]

[project.urls]
HomePage = "https://github.com/Linekio/getmyancestors"

[project.scripts]
getmyancestors = "getmyancestors.cli:main"

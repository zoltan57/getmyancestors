[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "getmyancestors"
description = "Retrieve GEDCOM data from FamilySearch Tree"
requires-python = ">=3.12"
license = {text = "GNU"}
keywords = [
  "getmyancestors",
  "familysearch",
  "fstogedcom",
  "gedcom",
]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
# Lower bounds only; exact versions are pinned by uv.lock. Upgrade deliberately
# with `uv lock --upgrade` (fake-useragent exists to avoid FamilySearch
# blocking — retest downloads after upgrading it).
dependencies = [
    "requests>=2.32.3",
    "fake-useragent>=2.0.3",
    # Deliberate exact pin: the LimiterAdapter mounted in classes/session.py
    # enforces the FamilySearch request rate. Held at the version validated
    # against FamilySearch; do not widen without retesting a real download
    # (0.8+ moves to pyrate-limiter 3.x with API/behavior changes).
    "requests-ratelimiter==0.7.0",
]
dynamic = ["version", "readme"]

[tool.setuptools.dynamic]
version = {attr = "getmyancestors.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
HomePage = "https://github.com/Linekio/getmyancestors"

[project.scripts]
getmyancestors = "getmyancestors.cli:main"
